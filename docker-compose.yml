services:
  # One-off job: materializes the feature store and trains/registers the
  # model *inside this container's own filesystem context*. This matters
  # because MLflow's local SQLite backend records each artifact's
  # location as an absolute path at write time -- running training on
  # the host would bake in host paths the `api` container can't resolve.
  # Re-run with `docker compose run --rm train` whenever the model or
  # feature store needs to be regenerated.
  train:
    build: .
    # MLflow's default artifact root is computed relative to the
    # process's CWD, not the tracking DB's location -- so CWD must be
    # inside the persistent volume, or artifacts land in the container's
    # throwaway filesystem and vanish when it exits.
    working_dir: /app/mlflow_data
    volumes:
      - ./reports/data_profile:/app/reports/data_profile
      - ./data/interim:/app/data/interim
      - ./data/processed:/app/data/processed
      - mlflow_data:/app/mlflow_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_data/mlflow.db
    entrypoint:
      [
        "sh",
        "-c",
        "python /app/scripts/materialize_features.py && python /app/scripts/train_with_mlflow.py",
      ]

  # HC-M4-16 — builds the real model + feature store for the AWS Lambda
  # deployment (Dockerfile.lambda), from the real dataset. Identical to
  # `train` above in every way except *where* the output lands: `train`
  # writes into the `mlflow_data` volume the local `api` service reads
  # from, while this writes into `./lambda_build/` on the host, which
  # `Dockerfile.lambda` later `COPY`s into the deployable image. Kept as
  # a separate service (rather than parameterizing `train`) so the local
  # dev artifact and the "what gets deployed" artifact can never be
  # silently conflated. Run with `docker compose run --rm lambda-fixture`
  # whenever the deployed model needs to be refreshed.
  #
  # `working_dir: /tmp/mlflow_data` (not `/app/mlflow_data`, unlike
  # `train` above) is deliberate, not a typo: MLflow's SQLite backend
  # bakes each artifact's location as an *absolute path*, computed from
  # the CWD at training time -- and Lambda's filesystem is read-only
  # everywhere except `/tmp` (Dockerfile.lambda copies this data into
  # `/tmp/mlflow_data` at container startup for exactly that reason).
  # Training here at any other path would bake in a path the deployed
  # Lambda can never actually read from -- discovered as a real
  # `MlflowException: No such artifact` on both a redeploy and a local
  # `sam local start-api` re-test, not assumed.
  lambda-fixture:
    build: .
    working_dir: /tmp/mlflow_data
    volumes:
      - ./reports/data_profile:/app/reports/data_profile
      - ./data/interim:/app/data/interim
      - ./lambda_build/data/processed:/app/data/processed
      - ./lambda_build/mlflow_data:/tmp/mlflow_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////tmp/mlflow_data/mlflow.db
    entrypoint:
      [
        "sh",
        "-c",
        "mkdir -p /tmp/mlflow_data && python /app/scripts/materialize_features.py && python /app/scripts/train_with_mlflow.py",
      ]

  # HC-M4-14 — CI only. Builds a tiny, fully synthetic model + feature
  # store (same synthetic-table pattern as tests/test_pipeline.py) so CI
  # can start the real `api` container and hit real endpoints, without
  # needing the ~2.9 GB Kaggle dataset or any credentials. Never use this
  # for anything except a smoke test -- `train` above is the real thing.
  ci-fixture:
    build: .
    working_dir: /app/mlflow_data
    volumes:
      - ./data/processed:/app/data/processed
      - mlflow_data:/app/mlflow_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_data/mlflow.db
    entrypoint: ["python", "/app/scripts/build_smoke_test_fixture.py"]

  api:
    build: .
    working_dir: /app/mlflow_data
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/processed:/app/data/processed:ro
      # Not read-only, despite `api` only ever *loading* a model: MLflow's
      # local artifact-repo implementation writes a small metadata sidecar
      # file into the model's own directory on every load, not just on
      # write -- discovered by hitting the real `OSError` this caused
      # under a `:ro` mount, not assumed.
      - mlflow_data:/app/mlflow_data
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_data/mlflow.db
    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  mlflow_data:
