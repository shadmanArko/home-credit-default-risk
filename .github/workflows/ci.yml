name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  # HC-M4-14 — real CI for the serving artifact, not just the library
  # code above. Builds the actual Docker image and starts it for real,
  # rather than just checking the build succeeds. The real dataset
  # (~2.9 GB, gitignored, Kaggle credentials required) isn't available
  # here, so `ci-fixture` (docker-compose.yml) trains a tiny, fully
  # synthetic model + feature store first -- the same synthetic-table
  # pattern already used in tests/test_pipeline.py -- specifically so
  # this job can hit real endpoints and assert real 200 responses
  # instead of skipping the check.
  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build ci-fixture api

      - name: Build synthetic model + feature store
        run: docker compose run --rm ci-fixture

      - name: Start API (skip the real `train` service — no dataset here)
        run: docker compose up -d --no-deps api

      - name: Wait for health check
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy" >&2
          exit 1

      - name: Smoke test POST /score (known synthetic applicant)
        run: |
          curl -sf -X POST http://localhost:8000/score \
            -H "Content-Type: application/json" \
            -d '{"sk_id_curr": 100}' | tee /dev/stderr | grep -q '"probability"'

      - name: Smoke test POST /apply (new applicant)
        run: |
          curl -sf -X POST http://localhost:8000/apply \
            -H "Content-Type: application/json" \
            -d '{"amt_income_total": 100000, "amt_credit": 400000, "amt_annuity": 20000, "amt_goods_price": 380000, "age_years": 35, "is_employed": true, "years_employed": 5, "cnt_children": 0, "code_gender": "F", "name_education_type": "Higher education", "name_family_status": "Married", "name_housing_type": "House / apartment", "flag_own_car": "N", "flag_own_realty": "Y", "credit_standing": "good"}' \
            | tee /dev/stderr | grep -q '"probability"'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # HC-M4-17 — CD: on a real merge to `main`, redeploy the *code* to the
  # already-existing Lambda stack (see docs/aws_deployment.md). This
  # never retrains: the real model + feature store are baked into the
  # image via `docker compose run --rm lambda-fixture` (a manual step,
  # run by the project owner on their own machine, since CI has no
  # access to the real ~2.9 GB Kaggle dataset) and then synced to a
  # small S3 bucket (`aws s3 sync lambda_build/ s3://.../lambda_build/`)
  # as part of that same manual step. This job downloads that same
  # `lambda_build/` from S3 before building, so `Dockerfile.lambda`'s
  # `COPY lambda_build/...` has something to copy — it is NOT reachable
  # from the git checkout, since lambda_build/ is deliberately gitignored
  # (same convention as mlflow.db/mlruns/, HC-M4-16). Requires repo
  # secrets this workflow cannot create on its own: AWS_ACCESS_KEY_ID,
  # AWS_SECRET_ACCESS_KEY, AWS_REGION, LAMBDA_ARTIFACTS_BUCKET — add them
  # under Settings → Secrets and variables → Actions before enabling
  # this job (it no-ops harmlessly without them, since `aws`/`sam` calls
  # simply fail rather than doing anything destructive).
  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Fetch the real model + feature store from S3
        run: aws s3 sync "s3://${{ secrets.LAMBDA_ARTIFACTS_BUCKET }}/lambda_build" lambda_build

      - name: Build
        run: sam build

      - name: Deploy (code-only update to the existing stack)
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
